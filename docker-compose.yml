version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sketch2startup-db
    environment:
      POSTGRES_USER: sketch2startup
      POSTGRES_PASSWORD: sketch2startup
      POSTGRES_DB: sketch2startup
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sketch2startup"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sketch2startup-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sketch2startup-api
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://sketch2startup:sketch2startup@db:5432/sketch2startup
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./server:/app
      - /app/.venv

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sketch2startup-client
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  default:
    name: sketch2startup-network
